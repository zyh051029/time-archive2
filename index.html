<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间档案馆 · 出生日大事件</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #d4a84b;
    --gold-light: #f5d78c;
    --deep: #0a0a12;
  }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--deep);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 星空 */
  .stars-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 620px; width: 100%;
  }

  /* 卡片 */
  .card {
    background: rgba(20,20,40,0.7);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    padding: 44px 36px 36px;
    box-shadow: 0 0 120px rgba(100,120,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    transition: all 0.6s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: -1px; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,168,75,0.5), transparent);
  }

  /* 标题 */
  .header {
    text-align: center; margin-bottom: 32px;
  }
  .emblem {
    width: 72px; height: 72px; margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid rgba(212,168,75,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: radial-gradient(circle, rgba(212,168,75,0.1), transparent 70%);
    box-shadow: 0 0 40px rgba(212,168,75,0.15);
  }
  h1 {
    font-size: 24px; font-weight: 700;
    color: #e8ddcc; letter-spacing: 3px;
  }
  .subtitle {
    color: rgba(200,190,170,0.5);
    font-size: 12px; letter-spacing: 4px;
    margin-top: 6px;
  }

  /* 输入区 */
  .input-group {
    display: flex; gap: 10px; margin-bottom: 24px;
  }
  .input-group input {
    flex: 1;
    padding: 15px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    color: #e8ddcc; font-size: 16px;
    font-family: inherit; text-align: center;
    outline: none;
    transition: all 0.3s;
  }
  .input-group input:focus {
    border-color: rgba(212,168,75,0.5);
    box-shadow: 0 0 20px rgba(212,168,75,0.1);
    background: rgba(255,255,255,0.07);
  }
  .input-group input::placeholder {
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
  }

  .search-btn {
    width: 100%; padding: 16px;
    border-radius: 18px; border: none;
    background: linear-gradient(135deg, #2a2a4a, #3a3a5a);
    border: 1px solid rgba(212,168,75,0.25);
    color: #d4a84b; font-size: 17px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    letter-spacing: 3px;
    transition: all 0.4s;
    position: relative; overflow: hidden;
  }
  .search-btn:hover {
    background: linear-gradient(135deg, #3a2a3a, #4a3a4a);
    border-color: rgba(212,168,75,0.5);
    box-shadow: 0 8px 32px rgba(212,168,75,0.2);
    letter-spacing: 5px;
  }
  .search-btn:active { transform: scale(0.97); }
  .search-btn:disabled {
    opacity: 0.5; cursor: not-allowed;
    letter-spacing: 3px;
  }

  /* 检索动画区 */
  .scan-section {
    display: none;
    margin-top: 20px;
  }
  .scan-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 16px;
    animation: scanPulse 1.2s ease-in-out infinite;
  }
  @keyframes scanPulse {
    0%,100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .scan-logs {
    font-family: 'Courier New', monospace;
    color: rgba(180,200,220,0.7);
    font-size: 12px; line-height: 2;
    min-height: 120px;
  }
  .scan-logs .log-line {
    opacity: 0;
    animation: logFadeIn 0.15s ease-out forwards;
  }
  @keyframes logFadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .scan-progress {
    margin-top: 12px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
  }
  .scan-progress .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 3px;
  }

  .scan-status {
    text-align: center; margin-top: 10px;
    color: rgba(200,190,170,0.5);
    font-size: 11px; letter-spacing: 2px;
  }

  /* 结果面板 */
  .result-panel {
    display: none;
    margin-top: 28px;
    text-align: center;
    animation: revealResult 1.2s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes revealResult {
    0%   { opacity: 0; transform: scale(0.92); filter: blur(10px); }
    60%  { opacity: 0.8; transform: scale(1.02); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  .result-ring {
    width: 140px; height: 140px; margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid rgba(212,168,75,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: ringGlow 3s ease-in-out infinite;
    background: radial-gradient(circle, rgba(255,200,100,0.08), transparent 65%);
  }
  @keyframes ringGlow {
    0%,100% { box-shadow: 0 0 40px rgba(212,168,75,0.1), inset 0 0 40px rgba(212,168,75,0.05); }
    50%     { box-shadow: 0 0 80px rgba(212,168,75,0.25), inset 0 0 60px rgba(212,168,75,0.12); }
  }
  .result-ring .ring-inner {
    font-size: 60px; line-height: 1;
    animation: bounceIn 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes bounceIn {
    0%   { transform: scale(0); }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .result-date {
    color: var(--gold);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .result-divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto;
  }

  .result-main-text {
    color: #e8ddcc;
    font-size: 15px; line-height: 2.2;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .result-highlight {
    color: var(--gold-light);
    font-size: 20px; font-weight: 700;
    letter-spacing: 3px;
    margin: 12px 0;
    text-shadow: 0 0 30px rgba(212,168,75,0.4);
  }
  .result-final {
    color: #f0e6d3;
    font-size: 15px; font-weight: 500;
    letter-spacing: 2px;
    margin-top: 6px;
  }

  /* 粒子爆发 */
  .burst-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .burst-particle {
    position: absolute;
    border-radius: 50%;
    animation: burstOut 1.8s cubic-bezier(0,0.7,0.3,1) forwards;
  }
  @keyframes burstOut {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
  }

  .disclaimer {
    margin-top: 20px;
    text-align: center;
    color: rgba(255,255,255,0.12);
    font-size: 11px;
  }

  @media (max-width: 500px) {
    .card { padding: 28px 18px 22px; border-radius: 24px; }
    h1 { font-size: 19px; letter-spacing: 2px; }
    .input-group { flex-direction: column; gap: 8px; }
    .result-highlight { font-size: 17px; }
  }
</style>
</head>
<body>

<canvas class="stars-canvas" id="starsCanvas"></canvas>

<div class="container">
  <div class="card">

    <!-- 头部 -->
    <div class="header">
      <div class="emblem">🏛️</div>
      <h1>时 间 档 案 馆</h1>
      <div class="subtitle">T I M E · A R C H I V E S</div>
    </div>

    <!-- 输入 -->
    <div class="input-group" id="inputGroup">
      <input type="number" id="birthYear" placeholder="年份" min="1900" max="2026" value="2000">
      <input type="number" id="birthMonth" placeholder="月份" min="1" max="12" value="1">
      <input type="number" id="birthDay" placeholder="日期" min="1" max="31" value="1">
    </div>

    <button class="search-btn" id="searchBtn">启 动 时 间 检 索</button>

    <!-- 扫描区 -->
    <div class="scan-section" id="scanSection">
      <div class="scan-line"></div>
      <div class="scan-logs" id="scanLogs"></div>
      <div class="scan-progress"><div class="bar" id="scanBar"></div></div>
      <div class="scan-status" id="scanStatus"></div>
    </div>

    <!-- 结果区 -->
    <div class="result-panel" id="resultPanel">
      <div class="result-ring"><div class="ring-inner">🌟</div></div>
      <div class="result-date" id="resultDate"></div>
      <div class="result-main-text" id="resultText1"></div>
      <div class="result-highlight" id="resultHighlight"></div>
      <div class="result-divider"></div>
      <div class="result-final" id="resultFinal"></div>
    </div>

    <div class="disclaimer">TIME ARCHIVES · EST. 2026</div>

  </div>
</div>

<div class="burst-container" id="burstContainer"></div>

<script>
// ========== 星空背景 ==========
(function(){
  const canvas = document.getElementById('starsCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<200;i++){
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*1.6+0.3,
      twinkle: Math.random()*Math.PI*2,
      speed: Math.random()*0.02+0.005,
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.twinkle += s.speed;
      const alpha = 0.25 + Math.sin(s.twinkle)*0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,200,240,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ========== 粒子爆发 ==========
function burstFireworks(x, y){
  const container = document.getElementById('burstContainer');
  const colors = ['#d4a84b','#f5d78c','#ffe4a0','#fff','#ffcc80','#ffd700'];
  const count = 40;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'burst-particle';
    const angle = (Math.PI*2*i)/count + (Math.random()-0.5)*0.3;
    const dist = 80 + Math.random()*140;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const size = Math.random()*4+2;
    p.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${dx}px; --dy:${dy}px;
      animation-delay:${Math.random()*0.3}s;
      animation-duration:${1.4+Math.random()*1}s;
    `;
    container.appendChild(p);
    setTimeout(()=>p.remove(), 2200);
  }
}

// ========== 主逻辑 ==========
const btn = document.getElementById('searchBtn');
const scanSection = document.getElementById('scanSection');
const scanLogs = document.getElementById('scanLogs');
const scanBar = document.getElementById('scanBar');
const scanStatus = document.getElementById('scanStatus');
const resultPanel = document.getElementById('resultPanel');

const logMessages = [
  '初始化时间量子引擎……',
  '校准时空坐标参数……',
  '连接泛维度数据库……',
  '正在检索：历史事件索引……',
  '正在检索：天文观测记录……',
  '正在检索：文明里程碑……',
  '正在检索：人类集体记忆……',
  '交叉验证时空锚点……',
  '发现高密度情感量子场……',
  '信号强度异常……正在放大……',
  '解码完成。准备呈现结果……',
];

btn.addEventListener('click', ()=>{
  const year = parseInt(document.getElementById('birthYear').value);
  const month = parseInt(document.getElementById('birthMonth').value);
  const day = parseInt(document.getElementById('birthDay').value);

  if(!year || !month || !day) return;
  if(year<1900||year>2026||month<1||month>12||day<1||day>31) return;

  // 隐藏之前的结果，显示扫描区
  resultPanel.style.display = 'none';
  scanSection.style.display = 'block';
  scanLogs.innerHTML = '';
  scanBar.style.width = '0%';
  btn.disabled = true;

  // 逐行显示日志
  const totalSteps = logMessages.length;
  let step = 0;
  const interval = setInterval(()=>{
    if(step < totalSteps){
      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = `[${String(step+1).padStart(2,'0')}] ${logMessages[step]}`;
      scanLogs.appendChild(div);
      scanBar.style.width = ((step+1)/totalSteps*100)+'%';
      scanStatus.textContent = `检索进度 ${Math.round((step+1)/totalSteps*100)}%`;
      scanLogs.scrollTop = scanLogs.scrollHeight;
      step++;
    } else {
      clearInterval(interval);
      scanStatus.textContent = '检索完成 · 发现重大事件';
      scanBar.style.width = '100%';

      // 短暂延迟后展示结果
      setTimeout(()=>{
        scanSection.style.display = 'none';
        showResult(year, month, day);
        btn.disabled = false;

        // 粒子爆发
        const rect = resultPanel.getBoundingClientRect();
        burstFireworks(rect.left+rect.width/2, rect.top+rect.height/2);
      }, 600);
    }
  }, 280);
});

function showResult(year, month, day){
  resultPanel.style.display = 'block';
  resultPanel.style.animation = 'none';
  resultPanel.offsetHeight;
  resultPanel.style.animation = 'revealResult 1.2s cubic-bezier(0.16,1,0.3,1)';

  document.getElementById('resultDate').textContent =
    `${year} 年 ${month} 月 ${day} 日`;

  document.getElementById('resultText1').innerHTML =
    '经过对时间线的<strong>深度检索</strong>，<br>'
    + '扫描了人类文明记录、天文数据、历史档案……';

  document.getElementById('resultHighlight').textContent =
    '当 天 最 大 的 事 件 就 是 ——';

  document.getElementById('resultFinal').innerHTML =
    '<strong style="font-size:24px;">你 出 生 了</strong> !!!<br>'
    + '<span style="color:#d4a84b;">这是这个世界上最美好的事件。</span>';
}

// 回车触发
document.querySelectorAll('input').forEach(inp=>{
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') btn.click();
  });
});
</script>
</body>
</html>
